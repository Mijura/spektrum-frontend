name: Deploy Frontend (Dev)

on:
    workflow_dispatch:
    push:
        branches: [development]

env:
    AWS_REGION: eu-west-1
    STACK_NAME: spektrum-frontend

jobs:
    deploy:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 20

            - name: Configure npm for private packages
              run: |
                  echo "//npm.pkg.github.com/:_authToken=${{ secrets.GH_PACKAGES_TOKEN }}" > .npmrc
                  echo "@jigjoy-ai:registry=https://npm.pkg.github.com" >> .npmrc

            - name: Create .env
              run: |
                  cat > .env << 'EOF'
                  API_GATEWAY=https://platform.dev.jigjoy.ai
                  JIGJOY_TOKEN_PRICE_ID=${{ secrets.JIGJOY_TOKEN_PRICE_ID }}
                  PADDLE_ENVIRONMENT=sandbox
                  PADDLE_TOKEN=${{ secrets.PADDLE_TOKEN }}
                  EOF

            - name: Install dependencies
              run: npm install --legacy-peer-deps

            - name: Build
              run: npm run build

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v4
              with:
                  aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                  aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                  aws-region: ${{ env.AWS_REGION }}

            - name: Deploy to S3
              run: |
                  BUCKET_NAME=$(aws cloudformation describe-stacks \
                      --stack-name ${{ env.STACK_NAME }} \
                      --query "Stacks[0].Outputs[?OutputKey=='WebHostingBucketName'].OutputValue" \
                      --output text)
                  aws s3 sync dist/ s3://$BUCKET_NAME --delete

            - name: Invalidate CloudFront cache
              run: |
                  DISTRIBUTION_ID=$(aws cloudformation describe-stacks \
                      --stack-name ${{ env.STACK_NAME }} \
                      --query "Stacks[0].Outputs[?OutputKey=='CloudFrontDistributionId'].OutputValue" \
                      --output text)
                  aws cloudfront create-invalidation --distribution-id $DISTRIBUTION_ID --paths "/*"
