name: Deploy Frontend (Dev Environment)
on:
 push:
  branches:
   - development

jobs:
 deploy:
  runs-on: ubuntu-latest
  environment: development
  permissions:
   contents: read
   packages: read

  steps:
   - name: Checkout
     uses: actions/checkout@v4

   - name: NodeJs Setup
     uses: actions/setup-node@v4
     with:
      node-version: 18

   - name: "Create .npmrc file"
     run: |
      echo "//npm.pkg.github.com/:_authToken=${{ secrets.MY_GITHUB_TOKEN }}" > .npmrc
      echo "@jigjoy-ai:registry=https://npm.pkg.github.com" >> .npmrc
      cat .npmrc

   - name: "Create env file"
     run: |
      touch .env
      echo HONEYCOMB_ENDPOINT=${{secrets.HONEYCOMB_ENDPOINT}} >> .env
      echo ACCOUNT_AND_BILLING_ENDPOINT=${{secrets.ACCOUNT_AND_BILLING_ENDPOINT}} >> .env
      echo USER_POOL_ID=${{secrets.USER_POOL_ID}} >> .env
      echo USER_POOL_WEB_CLIENT_ID=${{secrets.USER_POOL_WEB_CLIENT_ID}} >> .env
      cat .env

   - name: Dependency Installation
     run: npm install --legacy-peer-deps

   - name: Build
     run: npm run build

   - name: Config AWS Credentials
     uses: aws-actions/configure-aws-credentials@v4
     with:
      aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
      aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      aws-region: eu-west-1

   - name: Deploy to AWS S3
     run: aws s3 sync dist/ s3://${{ secrets.BUCKET_NAME }} --exclude 'assets/*' --delete
