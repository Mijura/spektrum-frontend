AWSTemplateFormatVersion: "2010-09-09"
Description: >
  S3 static website hosting + CloudFront CDN for the spektrum frontend SPA.

Parameters:
  HostedZoneId:
    Type: String
    Default: Z07735212HGZVO529ELA1
    Description: Route53 hosted zone ID for dev.jigjoy.ai
  DomainName:
    Type: String
    Default: app.dev.jigjoy.ai
    Description: Custom domain for the frontend

Resources:
  WebHostingBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${AWS::StackName}-web-hosting"
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: index.html
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced

  WebHostingBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebHostingBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: "*"
            Action: s3:GetObject
            Resource: !Sub "${WebHostingBucket.Arn}/*"

  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Origins:
          - Id: S3WebsiteOrigin
            DomainName: !Sub "${WebHostingBucket}.s3-website-${AWS::Region}.amazonaws.com"
            CustomOriginConfig:
              HTTPPort: 80
              OriginProtocolPolicy: http-only
        DefaultCacheBehavior:
          TargetOriginId: S3WebsiteOrigin
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          Compress: true
        Aliases:
          - !Ref DomainName
        ViewerCertificate:
          AcmCertificateArn: "{{resolve:ssm:/jigjoy/certs/frontend-wildcard-us-east-1}}"
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        DefaultRootObject: index.html
        CustomErrorResponses:
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0
        Enabled: true
        HttpVersion: http2and3

  DNSRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        HostedZoneId: Z2FDTNDATAQYW2
        DNSName: !GetAtt CloudFrontDistribution.DomainName

Outputs:
  WebHostingBucketName:
    Value: !Ref WebHostingBucket
    Export:
      Name: !Sub "${AWS::StackName}-WebHostingBucketName"

  WebHostingBucketWebsiteUrl:
    Value: !GetAtt WebHostingBucket.WebsiteURL
    Export:
      Name: !Sub "${AWS::StackName}-WebHostingBucketWebsiteUrl"

  CloudFrontDistributionId:
    Value: !Ref CloudFrontDistribution
    Export:
      Name: !Sub "${AWS::StackName}-CloudFrontDistributionId"

  FrontendUrl:
    Value: !Sub "https://${DomainName}"
    Export:
      Name: !Sub "${AWS::StackName}-FrontendUrl"
