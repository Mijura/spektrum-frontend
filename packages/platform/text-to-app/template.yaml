AWSTemplateFormatVersion: 2010-09-09
Description: >-
  text-to-app

Transform:
  - AWS::Serverless-2016-10-31

Globals:
  Api:
    Cors:
      AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
      AllowHeaders: "'content-type'"
      AllowOrigin: "'*'"

Resources:
  GenerateBlockFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/adapters/primary/generate-block/
      Handler: generate-block-adapter.generateBlockHandler
      Runtime: python3.12
      MemorySize: 1024
      Timeout: 100
      Architectures:
        - x86_64
      Events:
        GenerateBlock:
          Type: Api
          Properties:
            Path: /generate-block
            Method: POST
      Policies:
        - AWSLambdaBasicExecutionRole
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource:
                - !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:vars*

Outputs:
  WebEndpoint:
    Description: "API Gateway endpoint URL for Prod stage"
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/"
